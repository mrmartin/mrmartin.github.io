function explorerArt(x,y,running=true,alpha=1) {

function drawMemories(){const phase=mode==='paused'?priorMode:mode;
 if(phase==='watch'){
  watchIds.forEach((id,i)=>{const f=friends[id];if(f.state!=='hidden')return;const local=(watchTime-i*1.5)/1.25;if(local<=0)return;if(local>=1||reducedMotion){peekFriend(f,spots[f.spot]);return;}const t=local*local*(3-2*local),dest=spots[f.spot],q=at({x:lerp(BASE.x,dest.x,t),y:lerp(BASE.y,dest.y,t)});q.y-=Math.max(0,(local-.75)*4)*36*A;animal(f,q,.99*A,Math.abs(Math.sin(anim*12))*3*A);});
  if(watchTime>=watchIds.length*1.5)spots.filter(s=>!occupant(s.id)&&!s.vacated).forEach(s=>{const q=at(s);label('EMPTY',q.x,q.y-75*A,'#8b9876','#f6f7e0',Math.max(8,9*A));});
 }else if(phase==='peek'){friends.filter(f=>f.state==='hidden').forEach(f=>peekFriend(f,spots[f.spot]));}
 else if(phase==='swap'){
  [swapData.a,swapData.b].forEach((id,i)=>{const f=friends[id],from=spots[i===0?swapData.fromA:swapData.fromB],to=spots[f.spot];const t=clamp((swapTime-1.05)/2.45,0,1);if(t===0){peekFriend(f,from);return;}if(t===1){peekFriend(f,to);return;}const smooth=t*t*(3-2*t),bend=(i?1:-1)*Math.sin(t*Math.PI)*.13,q=at({x:lerp(from.x,to.x,smooth)+bend,y:lerp(from.y,to.y,smooth)});q.y-=36*A;animal(f,q,1.04*A,Math.abs(Math.sin(anim*10))*3*A);});
 }else if(phase==='play'){spots.filter(s=>s.reveal>0).forEach(s=>{const f=occupant(s.id);if(f)peekFriend(f,s);});}
}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash([]);background();drawCone();
 footprints.forEach(f=>{const q=at(f);ctx.globalAlpha=f.life*.23;ellipse(q.x-3*A*f.face,q.y,2*A,3*A,'#8c9971',-.3);ellipse(q.x+3*A*f.face,q.y+6*A,2*A,3*A,'#8c9971',.3);});ctx.globalAlpha=1;
 rings.forEach(r=>{const q=at(r),t=1-r.life/.65;ctx.globalAlpha=clamp(r.life/.65,0,1);ctx.beginPath();ctx.ellipse(q.x,q.y,(10+t*22)*A,(5+t*10)*A,0,0,TAU);ctx.strokeStyle=r.color;ctx.lineWidth=2*A;ctx.stroke();});ctx.globalAlpha=1;
 if(mode==='play'&&p.dest){const q=at(p.dest);ctx.beginPath();ctx.ellipse(q.x,q.y,11*A,5*A,0,0,TAU);ctx.strokeStyle='#fffbe4cc';ctx.lineWidth=2*A;ctx.stroke();}
 const objects=spots.map(s=>({y:s.y,draw:()=>drawSpot(s)}));objects.push({y:BASE.y,draw:drawBase},{y:rex.y,draw:drawDino});if(!p.atHome&&p.hidden===null)objects.push({y:p.y+.002,draw:drawPlayer});
 if(carrying!==null&&p.hidden===null)objects.push({y:follower.y,draw:()=>animal(friends[carrying],at(follower),.63*A,p.moving&&!reducedMotion?Math.abs(Math.sin(anim*10))*3*A:0)});
 objects.sort((a,b)=>a.y-b.y);objects.forEach(o=>o.draw());drawMemories();
 particles.forEach(t=>{const q=at(t);ctx.save();ctx.globalAlpha=clamp(t.life/.3,0,1);if(t.kind==='star')starShape(q.x,q.y-20*A,t.size*A,'#efd181',null,t.rotation);else leaf(q.x,q.y-10*A,t.size*2*A,t.size*A,t.rotation,'#a9bf80');ctx.restore();});
 if(mode==='play'&&rex.mode==='alert'&&!reducedMotion)roundRect(3*A,3*A,W-6*A,H-6*A,24*A,null,'#efcc9555',6*A);
}
function frame(now){if(!lastTime)lastTime=now;const delta=(now-lastTime)/1000;lastTime=now;
 // Android may freeze hidden tabs. Never let an unseen chase or memory swap advance.
 if(delta>.75&&['watch','play','peek','swap','celebrate'].includes(mode))pause();
 if(!testMode){accumulator+=clamp(delta,0,.055);while(accumulator>=STEP){update(STEP);accumulator-=STEP;}}
 render();requestAnimationFrame(frame);}
$('heroFriends').innerHTML=[1,0,2].map(i=>animalSVG(i)).join('');
$('mainButton').addEventListener('click',()=>{unlock();if(mode==='paused')resume();else if(mode==='won')makeRound(level+1);else if(mode==='tagged')retry();else{total=0;makeRound(1);}});
$('secondaryButton').addEventListener('click',()=>{unlock();const next=mode==='menu'?best:1;total=0;makeRound(next);});
$('goButton').addEventListener('click',()=>{unlock();if(mode==='peek')endPeek();else beginPlay();});
$('replayButton').addEventListener('click',()=>{unlock();if(mode==='watch')watchTime=0;else if(mode==='swap')swapTime=0;syncUI();});
$('homeButton').addEventListener('click',()=>choose(BASE,'home'));
$('peekButton').addEventListener('click',peek);$('pauseButton').addEventListener('click',pause);
$('soundButton').addEventListener('click',()=>{soundOn=!soundOn;syncSound();save();unlock();if(soundOn)tone(659,0,.13,.03);});
canvas.addEventListener('pointerdown',e=>{if(mode!=='play'||!e.isPrimary||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();const r=canvas.getBoundingClientRect();choose(fromScreen(e.clientX-r.left,e.clientY-r.top));});
scene.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();if(mode==='paused')resume();else pause();return;}
 if(mode==='play'&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)){e.preventDefault();const t=p.dest?copy(p.dest):copy(p);if(e.code==='ArrowUp')t.y-=.12;if(e.code==='ArrowDown')t.y+=.12;if(e.code==='ArrowLeft')t.x-=.12;if(e.code==='ArrowRight')t.x+=.12;t.x=clamp(t.x,0,1);t.y=clamp(t.y,.025,.975);choose(t);}
 if(e.key==='Tab'&&!$('overlay').hidden){const bs=Array.from($('overlay').querySelectorAll('button')).filter(b=>!b.hidden&&!b.disabled),first=bs[0],last=bs[bs.length-1];if(e.shiftKey&&(document.activeElement===first||!$('overlay').contains(document.activeElement))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||!$('overlay').contains(document.activeElement))){e.preventDefault();first.focus();}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();save();}});window.addEventListener('blur',pause);window.addEventListener('pagehide',save);
if(window.ResizeObserver)new ResizeObserver(resize).observe(scene);else window.addEventListener('resize',resize);
// A test harness exists only with ?test. It is never exposed in normal play.
if(testMode)Object.defineProperty(window,'__friends',{value:Object.freeze({
 snapshot:()=>JSON.parse(JSON.stringify({mode,priorMode,level,total,best,wanted,carrying,returned,misses,tags,p,rex,spots,friends,order,watchTime,peekTime,swapTime,swapData,swapped,safeTime,settle,elapsed,W,H,A,settings:settings()})),
 step:seconds=>{const n=Math.ceil(clamp(Number(seconds)||0,0,120)/STEP);for(let i=0;i<n;i++)update(STEP);syncUI();render();},
 screen:point=>at(point),
 start:n=>{makeRound(n);resize();},
 scenario:name=>{if(mode!=='play')return;if(name==='tag'){p.atHome=false;p.hidden=null;p.dest=null;p.x=.15;p.y=.55;rex={...rex,x:.15,y:.50,mode:'chase',time:7,grace:0};safeTime=0;carrying=null;}if(name==='inspect'){const s=spots[0];p.atHome=false;p.hidden=s.id;p.x=s.x;p.y=s.y;p.dest=null;rex={...rex,x:s.x,y:s.y-.15,mode:'inspect',inspect:s.id,time:7,inspectTime:.5};safeTime=0;}syncUI();render();}
})});
syncSound();makeRound(1);mode='menu';showPanel('menu');syncUI();resize();requestAnimationFrame(frame);
})();

</script>
